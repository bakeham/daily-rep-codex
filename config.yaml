    - AI Coding
    - Codex
    - Claude Code
    - opencode
    - Cursor
    - Kiro
    - Agent
    - MCP
    - tool calling
    - memory
    - RAG
    - GraphRAG
    - DBT
    - DSL
    - data quality
    - testing
    - QA
    - test case
    - test automation
    - 测试
    - 测试工程师
    - 测试用例
    - 测试自动化
    - 需求评审
    - 数据质量
    - 数据校验
    - 大数据测试

  qa_keywords:
    - testing
    - QA
    - quality assurance
    - test case
    - test generation
    - test automation
    - unit test
    - integration test
    - data quality
    - data validation
    - requirements review
    - 测试
    - 测试工程师
    - 测试用例
    - 测试自动化
    - 需求评审
    - 数据质量
    - 数据校验
    - 大数据测试
